name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  canonical-addressing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install --requirement requirements-dev.txt
      - run: npm run verify:all
